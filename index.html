<style>
    body, html {
        height: 100%;
        margin: 0;
        background-color: #000;
    }

    .bg-image {
        width: 100%;
        height: 100vh; /* Asegura que ocupe el alto de la pantalla */
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }

    /* Computadora */
    @media (min-width: 768px) {
        .bg-image { background-image: url("pc.png"); }
    }

    /* Celular */
    @media (max-width: 767px) {
        .bg-image { background-image: url("movil.png"); }
    }
</style>

<body>
    <div class="bg-image"></div>
</body>
