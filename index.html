<style>
    body, html {
        height: 100%;
        margin: 0;
        background-color: #000;
    }

    .bg-image {
        height: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;

            background-image: url("pc.png");

            background-image: url("movil.png");
        }
    }
</style>
